services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/renewal_radar.db
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Public demo mode, the same as render.yaml: samples and calculations only.
      APP_ENV: demo
    volumes:
      - radar_data:/app/data
    restart: unless-stopped
volumes:
  radar_data:
