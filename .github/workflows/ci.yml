name: tests
on:
  push:
    branches-ignore: [rates-data]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra
          tesseract --version
      - run: pip install -r requirements.txt
      - run: python tools/fetch_td_oracle.py || echo "TD files unavailable; oracle test will be skipped"
      - run: PYTHONPATH=backend pytest -q
      - run: node --test tests/*.test.mjs
