# Keeps the free Render demo awake so visitors do not land on a cold start.
# Render's free plan sleeps after about 15 minutes without traffic; this pings /health every 10 minutes.
name: keep-warm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the public demo
        run: |
          curl -fsS --max-time 90 --retry 2 https://renewal-radar-nplp.onrender.com/health -o /dev/null -w '%{http_code}\n' || true
          curl -fsS --max-time 60 https://renewal-radar-nplp.onrender.com/api/ratewatch/live -o /dev/null -w '%{http_code}\n' || true
